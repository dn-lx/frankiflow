name: Validate homepage feature

on:
  push:
    branches:
      - feature/homepage-admin-content

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate JavaScript
        run: npm run check
      - name: Check removed homepage wording
        run: |
          ! grep -RniE "homeprice calculator.*FrankiHolz|FrankiHolz.*homeprice calculator" public
