name: Validate admin CMS refinement

on:
  push:
    branches:
      - feature/admin-cms-ui-refinement

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate JavaScript
        run: npm run check
      - name: Confirm legacy copy editor is hidden
        run: grep -q "ff-copy-card{display:none" public/assets/cms-refinement.css
      - name: Confirm structured About Us migration
        run: grep -q "about_sections" migrations/005_frankiflow_about_sections.sql
