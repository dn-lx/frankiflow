name: Deploy develop to ShipStatic

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frankiflow-develop
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy development
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://frankiflow.shipstatic.com

    steps:
      - name: Checkout develop
        uses: actions/checkout@v6

      - name: Validate JavaScript
        run: npm run check

      - name: Run calculator tests
        run: npm test

      - name: Deploy public folder to ShipStatic
        id: shipstatic
        uses: shipstatic/action@v2
        with:
          token: ${{ secrets.SHIP_TOKEN }}
          path: ./public
          domain: frankiflow.shipstatic.com
          labels: development,frankiflow,develop

      - name: Show development URL
        run: |
          echo "### FrankiFlow development deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`develop\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://frankiflow.shipstatic.com" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.shipstatic.outputs.expires }}" ]; then
            echo "- Expiry: ${{ steps.shipstatic.outputs.expires }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Expiry: none (authenticated deployment)" >> "$GITHUB_STEP_SUMMARY"
          fi
