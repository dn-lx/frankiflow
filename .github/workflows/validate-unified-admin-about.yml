name: Validate unified admin and About page

on:
  push:
    branches:
      - feature/admin-unified-ui-about-page

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate JavaScript
        run: npm run check
      - name: Confirm dedicated About page
        run: |
          test -f public/about/index.html
          test -f public/assets/about-page.js
          grep -q 'https://frankiflow.de/about/' public/sitemap.xml
      - name: Confirm unified Admin assets
        run: |
          test -f public/assets/admin-unified-ui.css
          test -f public/assets/admin-unified-ui.js
          grep -q "admin-unified-ui.js" public/assets/admin.js
