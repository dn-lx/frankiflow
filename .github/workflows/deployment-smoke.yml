name: Deployment smoke

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: deploy / public-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Resolve deployment URL
        id: target
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "base=https://frankiflow.de" >> "$GITHUB_OUTPUT"
          else
            echo "base=https://develop--frankiflow.netlify.app" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for homepage deployment
        shell: bash
        env:
          BASE_URL: ${{ steps.target.outputs.base }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            body="$(curl -fsSL --max-time 15 "$BASE_URL/" 2>/dev/null || true)"
            if printf '%s' "$body" | grep -q "FrankiFlow"; then
              echo "Homepage ready at $BASE_URL"
              exit 0
            fi
            echo "Waiting for deployment ($attempt/30)..."
            sleep 10
          done
          echo "::error::Homepage deployment did not become ready: $BASE_URL"
          exit 1

      - name: Verify Calculator route
        shell: bash
        env:
          BASE_URL: ${{ steps.target.outputs.base }}
        run: |
          set -euo pipefail
          body="$(curl -fsSL --max-time 20 "$BASE_URL/calculator/")"
          printf '%s' "$body" | grep -q "FRANKIFLOW PREISRECHNER" || {
            echo "::error::Calculator route is missing expected V2 content"
            exit 1
          }

      - name: Verify legacy redirect
        shell: bash
        env:
          BASE_URL: ${{ steps.target.outputs.base }}
        run: |
          set -euo pipefail
          final="$(curl -sSIL --max-time 20 -o /dev/null -w '%{url_effective}' "$BASE_URL/preisrechner/")"
          case "$final" in
            */calculator/|*/calculator) ;;
            *)
              echo "::error::Legacy /preisrechner/ did not redirect to /calculator/: $final"
              exit 1
              ;;
          esac

      - name: Verify legal/business number
        shell: bash
        env:
          BASE_URL: ${{ steps.target.outputs.base }}
        run: |
          set -euo pipefail
          body="$(curl -fsSL --max-time 20 "$BASE_URL/impressum/")"
          printf '%s' "$body" | grep -q "4323852" || {
            echo "::error::Current Betriebsnummer is not present on Impressum"
            exit 1
          }
