name: Apply September FrankiFlow site upgrades
on:
  push:
    branches: [develop]
    paths:
      - scripts/apply-sept-site-upgrades.py
      - .github/workflows/apply-sept-site-upgrades.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
      - name: Apply site upgrades
        run: python scripts/apply-sept-site-upgrades.py
      - name: Validate files
        run: |
          node --check public/assets/app-base.js
          node --check public/assets/calculator.js
          grep -q 'id="about"' public/index.html
          grep -q 'FrankiFlow Accommodations' public/index.html
          grep -q 'Company Policy' public/company-policy/index.html
          grep -q 'requestService' public/preisrechner/index.html
          grep -q 'price-island' public/assets/calculator.css
          grep -q 'admin_enquiry' public/assets/app-base.js
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Implement requested FrankiFlow website upgrades"
          git push origin develop
