name: Next.js preview build

on:
  push:
    branches: [develop]
    paths:
      - "next-preview/**"
      - "netlify.toml"
      - ".github/workflows/next-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: next-preview
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Next.js preview
        run: npm run build
