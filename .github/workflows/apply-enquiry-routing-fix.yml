name: Apply enquiry routing repair

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frankiflow-enquiry-routing-repair
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Restore website enquiry admin and customer emails
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('public/assets/app-enhancements.js')
          text = path.read_text(encoding='utf-8')
          old = """  try{\n    const r=await fetch(`${FRANKIFLOW_CONFIG.supabaseUrl}/functions/v1/frankiflow-email`,{method:'POST',headers:{'Content-Type':'application/json','apikey':FRANKIFLOW_CONFIG.supabasePublishableKey},body:JSON.stringify({event_type:'enquiry_received',quote_request_id:quoteId,customer_email:payload.customer_email,language:getLanguage()})});\n    if(!r.ok)console.warn('FrankiFlow acknowledgement email failed',await r.text());\n  }catch(err){console.warn('FrankiFlow acknowledgement email failed',err)}\n"""
          new = """  try{\n    const endpoint=`${FRANKIFLOW_CONFIG.supabaseUrl}/functions/v1/frankiflow-email`;\n    const headers={'Content-Type':'application/json','apikey':FRANKIFLOW_CONFIG.supabasePublishableKey};\n    const common={quote_request_id:quoteId,customer_email:payload.customer_email,language:getLanguage()};\n    const results=await Promise.allSettled([\n      fetch(endpoint,{method:'POST',headers,body:JSON.stringify({event_type:'admin_enquiry',source:'website',...common})}),\n      fetch(endpoint,{method:'POST',headers,body:JSON.stringify({event_type:'enquiry_received',source:'website',...common})})\n    ]);\n    for(const result of results){\n      if(result.status==='rejected')console.warn('FrankiFlow enquiry email failed',result.reason);\n      else if(!result.value.ok)console.warn('FrankiFlow enquiry email failed',await result.value.text());\n    }\n  }catch(err){console.warn('FrankiFlow enquiry email failed',err)}\n"""
          if old not in text:
              raise SystemExit('Expected homepage enquiry email block not found; refusing unsafe patch.')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate repair
        run: |
          node --check public/assets/app-enhancements.js
          grep -q "event_type:'admin_enquiry'" public/assets/app-enhancements.js
          grep -q "event_type:'enquiry_received'" public/assets/app-enhancements.js
          grep -q "source:'website'" public/assets/app-enhancements.js

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/app-enhancements.js
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Restore enquiry notifications to FrankiFlow inbox"
          git push origin HEAD:main
