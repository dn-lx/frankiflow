name: Apply FrankiFlow site and calculator fixes
on:
  push:
    branches: [develop]
    paths:
      - scripts/apply-site-calculator-fixes.py
      - .github/workflows/apply-site-calculator-fixes.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 1
      - name: Fetch production calculator baseline
        run: git fetch origin main:refs/remotes/origin/main --depth=1
      - name: Apply repairs
        run: python scripts/apply-site-calculator-fixes.py
      - name: Validate JavaScript and pages
        run: |
          npm run check
          grep -q 'href="/about/">Über uns' public/index.html
          grep -q 'href="https://accommodation.frankiflow.de/">Accommodations</a></nav>' public/index.html
          ! grep -q 'FrankiFlow Accommodations' public/index.html
          ! grep -q 'http-equiv="refresh"' public/about/index.html
          grep -q 'id="aboutPageSections"' public/about/index.html
          grep -q 'calculator-mobile-island.js' public/preisrechner/index.html
          grep -q "visitTotal=gross(regularVisitNet)" public/assets/calculator.js
          grep -q "newCustomerValue" public/assets/calculator.js
      - name: Commit repaired files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public package.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix About page, navigation and price calculator"
          git push origin develop
