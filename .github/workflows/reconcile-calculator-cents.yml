name: Reconcile calculator visible totals
on:
  push:
    branches: [develop]
    paths:
      - scripts/reconcile-calculator-cents.py
      - .github/workflows/reconcile-calculator-cents.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
      - run: python scripts/reconcile-calculator-cents.py
      - name: Validate calculator
        run: |
          node --check public/assets/calculator.js
          grep -q 'Round customer-visible line items first' public/assets/calculator.js
          grep -q 'visitTotal\*visits' public/assets/calculator.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/calculator.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reconcile calculator totals to the cent"
          git push origin develop
