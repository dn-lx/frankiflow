name: Deploy production to ShipStatic

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frankiflow-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://frankiflow.shipstatic.com

    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Validate JavaScript
        run: npm run check

      - name: Run calculator tests
        run: npm test

      - name: Validate restored homepage structure
        run: |
          set -euo pipefail
          grep -q 'id="about"' public/index.html
          grep -q 'href="#about"' public/index.html
          ! grep -q 'id="warum"' public/index.html
          ! grep -q 'id="ablauf"' public/index.html
          ! grep -q 'href="#warum"' public/index.html
          ! grep -q 'href="#ablauf"' public/index.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          for page in [Path('public/index.html'), Path('public/en/index.html')]:
              html=page.read_text(encoding='utf-8')
              bad=re.findall(r'<a\b[^>]*href=["\']\/preisrechner\/?["\'][^>]*target=["\']_blank["\'][^>]*>',html,re.I)
              if bad:
                  raise SystemExit(f'{page}: Preisrechner still opens in a new tab: {bad[:2]}')
          PY

      - name: Deploy public folder to ShipStatic
        id: shipstatic
        uses: shipstatic/action@v2
        with:
          token: ${{ secrets.SHIP_TOKEN }}
          path: ./public
          domain: frankiflow.shipstatic.com
          labels: production,frankiflow,main

      - name: Verify production homepage
        run: |
          set -euo pipefail
          URL="https://frankiflow.shipstatic.com/?verify=${GITHUB_SHA}"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "$URL" -o /tmp/home.html; then break; fi
            sleep 3
          done
          grep -q 'id="about"' /tmp/home.html
          ! grep -q 'id="warum"' /tmp/home.html
          ! grep -q 'id="ablauf"' /tmp/home.html
          ! grep -q 'href="#warum"' /tmp/home.html
          ! grep -q 'href="#ablauf"' /tmp/home.html
          python3 - <<'PY'
          import re
          html=open('/tmp/home.html',encoding='utf-8').read()
          bad=re.findall(r'<a\b[^>]*href=["\']\/preisrechner\/?["\'][^>]*target=["\']_blank["\'][^>]*>',html,re.I)
          if bad: raise SystemExit('Live homepage still opens Preisrechner in a new tab')
          PY

      - name: Show production URL
        run: |
          echo "### FrankiFlow production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`main\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.shipstatic.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
