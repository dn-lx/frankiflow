name: Apply Betriebsnummer to FrankiFlow print

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/apply-betriebsnummer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Add Betriebsnummer next to tax identifiers
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          files = [
              Path('public/assets/calculator-app-v3.js'),
              Path('public/assets/calculator.js'),
          ]

          old = "<div><span>${lang==='de'?'Steuernummer':'Tax no.'}</span><strong>014/811/68462</strong></div><div><span>W-IdNr.</span><strong>DE464605581</strong></div>"
          new = "<div><span>${lang==='de'?'Steuernummer':'Tax no.'}</span><strong>014/811/68462</strong></div><div><span>${lang==='de'?'Betriebsnummer':'Employer no.'}</span><strong>69471447</strong></div><div><span>W-IdNr.</span><strong>DE464605581</strong></div>"

          old_legacy = "<div><span>${currentLang==='de'?'Steuernummer':'Tax no.'}</span><strong>014/811/68462</strong></div><div><span>W-IdNr.</span><strong>DE464605581</strong></div>"
          new_legacy = "<div><span>${currentLang==='de'?'Steuernummer':'Tax no.'}</span><strong>014/811/68462</strong></div><div><span>${currentLang==='de'?'Betriebsnummer':'Employer no.'}</span><strong>69471447</strong></div><div><span>W-IdNr.</span><strong>DE464605581</strong></div>"

          for path in files:
              text = path.read_text()
              if path.name == 'calculator-app-v3.js':
                  if old not in text:
                      raise SystemExit(f'Expected company footer pattern not found in {path}')
                  text = text.replace(old, new, 1)
              else:
                  if old_legacy not in text:
                      raise SystemExit(f'Expected company footer pattern not found in {path}')
                  text = text.replace(old_legacy, new_legacy, 1)
              path.write_text(text)
          PY

      - name: Validate JavaScript
        run: |
          node --check public/assets/calculator-app-v3.js
          node --check public/assets/calculator.js
          grep -q "69471447" public/assets/calculator-app-v3.js
          grep -q "69471447" public/assets/calculator.js

      - name: Commit develop-only change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/calculator-app-v3.js public/assets/calculator.js
          git commit -m "Add Betriebsnummer to FrankiFlow print footer"
          git push origin develop
