name: Apply calculator homepage header

on:
  push:
    branches: [develop]
    paths:
      - scripts/patch-calculator-site-header.py
      - public/assets/calculator-site-header.css
      - public/assets/calculator-site-header.js
      - .github/workflows/apply-calculator-site-header.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply calculator header
        run: python3 scripts/patch-calculator-site-header.py
      - name: Validate calculator header
        run: |
          node --check public/assets/calculator-site-header.js
          grep -q 'class="site-header calc-site-header"' public/preisrechner/index.html
          grep -q 'calculator-site-header.css' public/preisrechner/index.html
          grep -q 'calculator-site-header.js' public/preisrechner/index.html
          grep -q 'https://stay.frankiflow.de/' public/preisrechner/index.html
          grep -q 'loadHeaderLogoWidth' public/assets/calculator-site-header.js
          if grep -q 'class="calc-header"' public/preisrechner/index.html; then exit 1; fi
      - name: Commit develop-only calculator header
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/preisrechner/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Match calculator header with homepage"
          git push origin develop
