name: Apply requested FrankiFlow develop fixes
on:
  push:
    branches: [develop]
    paths:
      - scripts/apply-requested-develop-fixes.py
      - .github/workflows/apply-requested-develop-fixes.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 1
      - name: Apply requested changes
        run: python scripts/apply-requested-develop-fixes.py
      - name: Run syntax checks and calculator tests
        run: |
          npm run check
          npm test
          test ! -f public/about/index.html
          grep -q 'id="aboutAccordion"' public/index.html
          grep -q 'id="windowContractGrid"' public/admin/index.html
          grep -q 'id="quoteRequestModal"' public/preisrechner/index.html
          grep -q 'await waitForPrintAssets()' public/assets/calculator.js
      - name: Commit develop-only fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Implement requested develop-only website and calculator fixes"
          git push origin develop
